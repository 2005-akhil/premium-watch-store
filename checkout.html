<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | Titan Watch Store</title>

  <link rel="stylesheet" href="css/style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <style>
    .checkout-page {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .checkout-card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .checkout-card h2 {
      margin-bottom: 25px;
    }

    .checkout-product {
      text-align: center;
    }

    .checkout-product img {
      width: 260px;
      height: 260px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .checkout-product h3 {
      margin: 10px 0;
    }

    .checkout-price {
      font-size: 24px;
      font-weight: bold;
      color: var(--gold);
    }

    .checkout-form label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .checkout-form input,
    .checkout-form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .checkout-form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .place-order-btn {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 6px;
      background: #c9a227;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .place-order-btn:hover {
      opacity: 0.9;
    }

    .order-message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }

    @media (max-width: 768px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="checkout-page">

    <h1>Complete Your Order</h1>

    <div class="checkout-grid">

      <!-- PRODUCT -->
      <div class="checkout-card checkout-product">

        <h2>Your Watch</h2>

        <img id="checkoutImage" src="" alt="Watch">

        <h3 id="checkoutName">Loading...</h3>

        <div class="checkout-price" id="checkoutPrice">
          ₹0
        </div>

      </div>

      <!-- CUSTOMER DETAILS -->
      <div class="checkout-card">

        <h2>Customer Details</h2>

        <form id="checkoutForm" class="checkout-form">

          <label for="customerName">
            Full Name
          </label>

          <input
            type="text"
            id="customerName"
            required
          >

          <label for="customerEmail">
            Email Address
          </label>

          <input
            type="email"
            id="customerEmail"
            required
          >

          <label for="customerPhone">
            Phone Number
          </label>

          <input
            type="tel"
            id="customerPhone"
            required
          >

          <label for="customerAddress">
            Delivery Address
          </label>

          <textarea
            id="customerAddress"
            required
          ></textarea>

          <button
            type="submit"
            class="place-order-btn"
          >
            <i class="fas fa-shopping-bag"></i>
            <!-- DEMO QR PAYMENT -->
<div class="demo-payment">

  <h3>Demo Payment</h3>

  <p>Scan the QR code to complete the demo purchase</p>

  <div id="demoQRCode"></div>

  <p class="demo-qr-note">
    Demo QR — No real payment
  </p>

</div>
            Place Order
          </button>

        </form>

        <div id="orderMessage" class="order-message"></div>

      </div>

    </div>

  </div>

  <script type="module" src="js/checkout.js"></script>
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  new QRCode(document.getElementById("demoQRCode"), {
    text: "Thanks for buying from Titan Watch Store! Your order has been received. 🎉",
    width: 180,
    height: 180
  });
</script>
</body>
</html>
